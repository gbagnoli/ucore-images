name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Build the shared base first: on main/scheduled builds the per-host images
  # use ghcr.io/gbagnoli/ucore-common:latest, so it must be pushed first in
  # that workflow run. Pull-request builds validate without publishing; their
  # host recipes use the latest published common image.
  build-common:
    name: Build ucore-common
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.14
        with:
          recipe: ucore-common.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  build-skillet:
    name: Build pinned Skillet bundles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/ublue/skillet/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Read release dependency
        id: source
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path
          # Bootstrap extraction only; the source validator checks the complete contract.
          data = json.loads(Path("skillet-release.json").read_text())
          revision, version = data["commit"], data["version"]
          if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Invalid release commit")
          if not isinstance(version, str) or not re.fullmatch(r"[0-9A-Za-z.-]+", version):
              raise SystemExit("Invalid release version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={revision}\nversion={version}\n")
          PYTHON
      - uses: actions/checkout@v7
        with:
          repository: gbagnoli/devmachine
          ref: ${{ steps.source.outputs.revision }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Verify published release, tag, source commit and workspace version
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLET_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh api "repos/gbagnoli/devmachine/releases/tags/skillet-v$SKILLET_VERSION" > "$RUNNER_TEMP/skillet-publication.json"; then
            echo "::error::Cannot read published devmachine release skillet-v$SKILLET_VERSION. Publish that source release before building images; a Git tag alone is insufficient. Also check GitHub API access if the release exists."
            exit 1
          fi
          python3 source/ublue/skillet/tools/release.py --tag "skillet-v$SKILLET_VERSION" \
            --lock-file "$GITHUB_WORKSPACE/skillet-release.json" \
            --release-json "$RUNNER_TEMP/skillet-publication.json"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install CI musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/ublue/skillet -> target
      - name: Build matching binaries
        working-directory: source/ublue/skillet
        env:
          SKILLET_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SKILLET_REVISION"
          test -z "$(git status --porcelain)"
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            -p skillet -p skillet-clamps -p skillet-joey -p skillet-donbot
      - name: Render and archive public bundles
        working-directory: source/ublue/skillet
        env:
          SKILLET_REVISION: ${{ steps.source.outputs.revision }}
          SKILLET_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 tools/release.py --tag "skillet-v$SKILLET_VERSION" \
            --lock-file "$GITHUB_WORKSPACE/skillet-release.json" \
            --binary-dir "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release"
          install -d -m 0755 "$RUNNER_TEMP/skillet-bundles"
          binary_dir="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release"
          for host in clamps joey donbot; do
            tree="$RUNNER_TEMP/skillet-tree-$host"
            "$binary_dir/skillet" image "$host" \
              --source-revision "$SKILLET_REVISION" \
              --generic-binary "$binary_dir/skillet" \
              --host-binary "$binary_dir/skillet-$host" --output "$tree"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -czf "$RUNNER_TEMP/skillet-bundles/$host.tar.gz" -C "$tree" usr
          done
      - uses: actions/upload-artifact@v7
        with:
          name: skillet-bundles
          path: ${{ runner.temp }}/skillet-bundles/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-hosts:
    name: Build ucore-${{ matrix.host }}
    needs: [build-common, build-skillet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        host: [joey, clamps, donbot]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: skillet-bundles
          path: ${{ runner.temp }}/skillet-bundles
      - name: Verify selected image bundle
        env:
          SKILLET_HOST: ${{ matrix.host }}
          SKILLET_REVISION: ${{ needs.build-skillet.outputs.revision }}
          SKILLET_VERSION: ${{ needs.build-skillet.outputs.version }}
        run: |
          set -euo pipefail
          revision="$SKILLET_REVISION"
          tree="$PWD/files/skillet-$SKILLET_HOST"
          install -d -m 0755 "$tree"
          tar --same-permissions --no-same-owner -xzf "$RUNNER_TEMP/skillet-bundles/$SKILLET_HOST.tar.gz" -C "$tree"
          test "$("$tree/usr/bin/skillet" --version)" = "skillet $SKILLET_VERSION+git.${revision:0:12}"
          "$tree/usr/bin/skillet" image "$SKILLET_HOST" \
            --source-revision "$revision" --generic-binary "$tree/usr/bin/skillet" \
            --host-binary "$tree/usr/bin/skillet-$SKILLET_HOST" --output "$tree"
      - name: Build Custom Image
        uses: blue-build/github-action@v1.14
        with:
          recipe: ucore-${{ matrix.host }}.yml
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
