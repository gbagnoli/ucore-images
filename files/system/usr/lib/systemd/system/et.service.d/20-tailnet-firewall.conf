# Static ET tailnet grants. Skillet derives separate LAN grants from host NICs.
# Keep runtime and persistent rules without reloading Podman/Tailscale firewalls.
[Unit]
Requires=firewalld.service
After=firewalld.service

[Service]
ExecStartPre=/usr/bin/firewall-cmd --permanent '--add-rich-rule=rule family="ipv4" source address="100.64.0.0/10" port port="2022" protocol="tcp" accept'
ExecStartPre=/usr/bin/firewall-cmd --permanent '--add-rich-rule=rule family="ipv6" source address="fd7a:115c:a1e0::/48" port port="2022" protocol="tcp" accept'
ExecStartPre=/usr/bin/firewall-cmd '--add-rich-rule=rule family="ipv4" source address="100.64.0.0/10" port port="2022" protocol="tcp" accept'
ExecStartPre=/usr/bin/firewall-cmd '--add-rich-rule=rule family="ipv6" source address="fd7a:115c:a1e0::/48" port port="2022" protocol="tcp" accept'
