# Source from bootupd's custom.cfg hook. Trial state lives on unencrypted /boot.
if [ -s $prefix/skillet-trial.env ]; then
  load_env -f $prefix/skillet-trial.env skillet_trial_candidate skillet_trial_fallback skillet_trial_attempts
  if [ -f /loader/skillet-trial-before-finalize ]; then
    set default=0
  elif [ -n "${skillet_trial_fallback}" ]; then
    set default="${skillet_trial_fallback}"
    if [ -n "${skillet_trial_candidate}" -a "${skillet_trial_attempts}" = "2" ]; then
      set skillet_trial_attempts=1
      if save_env -f $prefix/skillet-trial.env skillet_trial_attempts; then
        set default="${skillet_trial_candidate}"
      fi
    elif [ -n "${skillet_trial_candidate}" -a "${skillet_trial_attempts}" = "1" ]; then
      set skillet_trial_attempts=0
      if save_env -f $prefix/skillet-trial.env skillet_trial_attempts; then
        set default="${skillet_trial_candidate}"
      fi
    fi
  fi
fi
