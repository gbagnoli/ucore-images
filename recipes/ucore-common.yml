---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/gbagnoli/ucore-common
name: ucore-common
# description will be included in the image's metadata
description: Shared uCore base for the home fleet (joey, donbot, clamps).

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/ucore
image-version: stable

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image's root folder /

  - type: dnf
    install:
      packages:
        - wol # Wake-on-LAN magic packet sender (replaces our old wrapper script)
        - et # EternalTerminal server (remote shell with session persistence)
        - postfix # Native fleet submission relay; Skillet supplies runtime configuration
        - cyrus-sasl-plain # SMTP PLAIN/LOGIN authentication over verified STARTTLS
        - nut # Native USB UPS driver/server; Skillet opts in per host
        - nut-client # Local UPS monitor and shutdown integration
        - btrbk # Btrfs snapshot and backup management for opted-in hosts

  - type: systemd
    system:
      enabled:
        - et.service
        - podman-auto-update.timer
      disabled:
        - nut.target
        - nut-driver.target
        - nut-server.service
        - nut-monitor.service
        - nut-driver-enumerator.service
        - nut-driver-enumerator.path
        - nut-driver-enumerator-daemon.service
        - nut-driver-enumerator-daemon-activator.service
        - nut-driver-enumerator-daemon-activator.path
        - postfix.service # Activate only after encrypted relay configuration is delivered
      masked:
        - btrbk.timer # Skillet opts in with its guarded hourly timer per host

  - type: signing # sets up the cosign policy & signing files for signed images
