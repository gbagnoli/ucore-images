---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/gbagnoli/ucore-beelzebot
name: ucore-beelzebot
description: uCore for beelzebot (formerly boxy).

# thin per-host layer on top of the shared fleet base
base-image: ghcr.io/gbagnoli/ucore-common
image-version: latest

modules:
  # Pi-hole owns host port 53, matching the selected Skillet host profile.
  - type: systemd
    system:
      masked:
        - systemd-resolved.service

  - type: signing
