---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/gbagnoli/ucore-donbot
name: ucore-donbot
description: uCore for donbot (future host; formerly calculon).

# thin per-host layer on top of the shared fleet base
base-image: ghcr.io/gbagnoli/ucore-common
image-version: latest

modules:
  - type: files
    files:
      - source: skillet-donbot
        destination: /

  - type: dnf
    install:
      packages:
        - file
        - findutils
        - grep
        - gzip
        - jq
        - parallel
        - rclone
        - rsync
        - tar
        - wget

  - type: script
    scripts:
      - install-gpth.sh

  - type: signing
